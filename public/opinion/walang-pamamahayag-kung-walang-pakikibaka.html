<style>
:root{color-scheme:dark;--bg:#050403;--ink:#e8e0cf;--dim:#9a917e;--red:#b3262d;--paper:#d8d0bb;--mono:'Special Elite','Courier New',monospace;--serif:'Newsreader',Georgia,serif;box-sizing:border-box}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;perspective:1100px;background:var(--bg)}
#world{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
#board{position:absolute;background:#2b2018;border:28px solid #140d08;box-shadow:inset 0 0 120px #000,0 0 80px #000;
background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px),radial-gradient(rgba(0,0,0,.35) 1px,transparent 2.2px),radial-gradient(rgba(120,80,40,.25) 2px,transparent 3px);background-size:7px 7px,11px 13px,19px 17px}
#strings{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.card{position:absolute;background:var(--paper);padding:10px 10px 0;box-shadow:0 10px 24px rgba(0,0,0,.7);color:#161310;font-family:var(--mono)}
.card img{display:block;width:100%;object-fit:cover}
.card .cap{height:56px;padding-top:7px;font-size:12px;line-height:1.25}.card .cap b{display:block;font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:.04em}.card .cap i{font-style:normal;color:#6b6252;font-size:10px}
.pin{position:absolute;left:50%;top:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a80,var(--red) 45%,#4a0b0e);box-shadow:0 4px 5px rgba(0,0,0,.6)}
.void{position:absolute;width:300px;height:190px;background:#cfc7b2;padding:26px 24px;box-shadow:0 10px 24px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:14px;justify-content:center}.void span{height:15px;background:#0b0907;display:block}
#spot{position:absolute;inset:0;pointer-events:none}
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:calc(18px + env(safe-area-inset-top,0px)) 22px 18px;display:flex;justify-content:space-between;align-items:flex-start}
#hud b{font-weight:400;color:var(--red)}
#title{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 7vw;pointer-events:none;transition:opacity .6s}
#title h1{font:700 clamp(26px,5.4vw,70px)/1.08 var(--serif);margin:0;text-shadow:0 4px 30px #000;letter-spacing:-.01em}
#title p{font:12px var(--mono);letter-spacing:.3em;color:var(--dim);margin-top:28px;text-transform:uppercase;animation:bl 2.2s infinite}@keyframes bl{50%{opacity:.25}}
.panel{position:fixed;left:3.5vw;bottom:calc(5vh + env(safe-area-inset-bottom,0px));width:min(470px,38vw);max-height:80vh;opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s;pointer-events:none;background:linear-gradient(90deg,rgba(5,4,3,.82),rgba(5,4,3,.55));border-left:3px solid var(--red);padding:18px 22px}
.panel.on{opacity:1;transform:none}
.panel small{display:block;font:11px var(--mono);letter-spacing:.22em;color:var(--red);margin-bottom:10px}
.panel p{margin:0;font:400 clamp(13.5px,1.08vw,17px)/1.62 var(--serif)}
@media(max-width:760px){.panel{left:0;right:0;width:auto;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(5,4,3,.95),rgba(5,4,3,.8));max-height:52vh}.panel p{font-size:12px;line-height:1.5}.panel small{margin-bottom:6px}#hud{font-size:10px}}

<script>
const T="Walang Pamamahayag Kung Walang Pakikibaka, Walang Pakikibaka Kung Walang Pamamahayag",P=["Sa kasaysayan ng Pilipinas, ang mamamahayag at ang aktibista ay hindi kailanman dalawang magkahiwalay na uri ng tao. Iisa ang ugat nila. Si Marcelo H. del Pilar ay naglathala ng Diariong Tagalog sa Maynila noong 1882 at tinugis ng mga prayle dahil sa pagpuna sa mga abuso. Napilitan siyang lumikas sa Espanya noong 1888, at doon niya pinamunuan ang La Solidaridad matapos itatag ni Graciano López Jaena noong 1889. Hindi lamang sila nagsulat. Nag-organisa rin sila at bumuo ng mga samahan, gaya ng La Liga Filipina ni Rizal noong 1892. Ang panulat ang paraan nila ng pag-oorganisa, at ang pag-oorganisa ang nagbigay ng saysay sa panulat.", "Ganito rin ang Katipunan. Ang Kalayaan, ang pahayagan nito na pinamatnugutan ni Emilio Jacinto noong 1896, ay hindi simpleng babasahin. Isa itong kasangkapan ng rebolusyon, na nagpapalaganap ng ideya at humuhubog ng kamalayan. Sa tradisyonal na salaysay, ang mismong paglilimbag nito ang naging mitsa ng pagkakatuklas sa lihim na samahan nang magkagalit ang mga kasapi sa palimbagan ng Diario de Manila. Makikita rito kung gaano kapanganib ang pamamahayag na may pinapanigan, at kung gaano ito kahalaga sa kilusan. Sa panahon ng Himagsikan, si Antonio Luna ay heneral na, at nagtatag din ng La Independencia noong 1898.", "Hindi nagbago ang ugnayang ito sa ilalim ng mga Amerikano, bagkus ay lalo itong tinugis. Ipinasa ang Batas Sedisyon ng 1901 at ang Batas sa Watawat ng 1907 upang pigilan ang pagpapahayag ng damdaming makabayan. Inaresto si Aurelio Tolentino noong 1903 dahil sa dulang Kahapon, Ngayon, at Bukas. Si Isabelo de los Reyes, mamamahayag at manunulat, ang nagtatag ng Unión Obrera Democrática noong 1902, ang itinuturing na unang pederasyon ng mga manggagawa sa bansa. Noong 1908, ang editoryal na “Aves de Rapiña” sa El Renacimiento ay nauwi sa kasong libel laban sa pahayagan at sa mga namatnugot nito. Noong dekada ‘30, ang manunulat na si Benigno Ramos ay naglathala ng Sakdal at pinamunuan ang kilusang Sakdalista ng mga magsasaka, na nagbunsod ng pag-aalsa noong 1935. Pamamahayag ang nagbigay ng tinig sa kilusan, at kilusan ang nagbigay ng mambabasa sa pamamahayag.", "Pinakamalinaw ito noong Batas Militar. Nang ipasara ang mga pahayagan, radyo, at telebisyon noong 1972, hindi namatay ang pamamahayag. Lumipat ito sa kamay ng mga taong handang magtaya. Lumitaw ang tinawag na “mosquito press,” gaya ng Malaya, Mr. & Ms., at We Forum, na maliit at palaging nasa panganib ngunit patuloy na nagbubunyag. Nang salakayin ang opisina ng We Forum noong 1982 at arestuhin ang patnugot nitong si Joe Burgos, malinaw na ang mismong pagsasalaysay ng katotohanan ay itinuturing nang paglaban. Sa kabilang banda, ang mga estudyante, relihiyoso, at manggagawa ang nagkopya, nagdala, at nagpamudmod ng mga babasahing hindi maaaring ilabas sa liwanag. Hindi sana umabot sa mambabasa ang mga ulat kung walang aktibistang nagtago at nagkalat ng mga ito. Hindi rin sana nalaman ng bayan ang mga pagpaslang at paglabag kung walang mamamahayag na nagtala. Kasama sa pangyayaring ito ang Radio Veritas, na naging boses ng bayan noong EDSA 1986.", "Pagkatapos ng 1986, ginarantiyahan ng Saligang Batas ng 1987 ang kalayaan sa pamamahayag. Ngunit ang garantiya sa papel ay hindi garantiya sa buhay. Noong 2009, sa Maguindanao, 58 katao ang pinaslang, kabilang ang 32 mamamahayag at manggagawa sa media, ang pinakamadugong pag-atake sa pamamahayag sa buong mundo. Si Gerry Ortega, brodkaster at tagapagtanggol ng kalikasan sa Palawan, ay binaril noong 2011 dahil sa pagbubunyag ng katiwalian at pagtutol sa pagmimina. Siya mismo ang patunay na hindi mapaghihiwalay ang dalawang tungkulin. Noong 2020, ipinagkait sa ABS-CBN ang prangkisa nito, at si Maria Ressa ay hinabla ng sunud-sunod na kaso bago tumanggap ng Nobel Peace Prize noong 2021. Noong 2022, pinaslang si Percy Lapid habang pauwi.", "Iisa ang hulma, at iisa rin ang tatak na ikinakabit sa kanilang dalawa. Ang mamamahayag ay tinatawag na kaaway, at ang aktibista ay tinatawag na terorista. Hindi ito aksidente. Alam ng mga nasa kapangyarihan na kapag nahiwalay ang dalawa, madali silang pabagsakin. Kapag walang aktibista, wala nang kuwentong maitatala, walang taong magtatanggol sa mamamahayag, at walang mambabasang kikilos. Kapag walang mamamahayag, ang aktibista ay nagiging isang boses na madaling siraan at kalimutan, at ang kanyang sakripisyo ay nawawala sa kasaysayan.", "Kaya ang panggigipit kay Aaron Ernest Cruz ay hindi pangyayaring nag-iisa. Kabilang ito sa mahabang tradisyon ng pagtatangkang paghiwalayin ang dalawang kamay na magkasamang nagtatanggol sa bayan. At gaya ng lahat ng nauna, mabibigo rin ito, dahil ang kasaysayan mismo ang nagpapatunay: kapag may sumulat, may kumilos. Kapag may kumilos, may sumulat."],I=[{"src": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAIwAc0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0QN2pw5FKEGM9aNwxwOKAI2JGcCkQsDz0p/Vx6CnAAjNACdSPak25yT603c7NlRwKk3AjBByaAFU4AwOlNkAY0/bhcd6iAYvzQA0kqwxTgWJyKftBY+lPTg4xxQA3LMRmnkDZQ2AuelBPy47UAR+TxyeKUIB0pQ+TtpwGOaAGYxTT1p560jDigAz70rUxlwMr1pDuwCaAHqAxOO1GMkUxNytkVIDnIoATa27Ocik2hiRjmnAFuOlCqFJJPJoAacRnGOtSKdoz61GWG4Buc07zIkwWcAfWgBjECTJpN/J
