<style>
:root{--navy:#000E4B;--blue:#00198D;--mid:#071D72;--gold:#F5C84B;--text:#000E4B;--dim:rgba(0,14,75,.55);--glass:rgba(255,255,255,.62);--glass2:rgba(0,25,141,.08);--line:rgba(0,25,141,.12);--mine:linear-gradient(135deg,#3d6bff,#00198D);--f:'Source Sans 3',-apple-system,'SF Pro Display','Segoe UI',sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#000E4B;--text:#000E4B}}
:root[data-theme="dark"]{--navy:#000E4B;--text:#000E4B}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:#f4f6ff;color:var(--text)}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 80% at 50% 0%,#ffffff 0%,#f3f6ff 60%,#e3eaff 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38;animation:drift 18s ease-in-out infinite alternate}
.o1{width:320px;height:320px;background:#3d6bff;top:-60px;left:-80px}
.o2{width:280px;height:280px;background:#7a4dff;bottom:8%;right:-90px;animation-delay:-6s}
.o3{width:200px;height:200px;background:var(--gold);bottom:-60px;left:25%;opacity:.35;animation-delay:-11s}
@keyframes drift{to{transform:translate(40px,-50px) scale(1.15)}}
.glass{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,25,141,.12),inset 0 1px 0 rgba(255,255,255,.95)}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr;max-width:1100px;margin:0 auto;padding:10px;gap:10px}
.side,.chat{border-radius:28px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chat{display:none}
.app.in .side{display:none}.app.in .chat{display:flex}
@media(min-width:800px){.app{grid-template-columns:340px 1fr;padding:18px;gap:16px}.app.in .side,.chat{display:flex}.back{display:none!important}}
.sh{padding:20px 20px 10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#ff9a3d);display:grid;place-items:center;font-weight:800;color:var(--navy)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.brand p{font-size:11px;color:var(--dim);margin-top:1px}
.search{margin-top:14px;width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--text);font:500 14px var(--f);outline:none}
.search::placeholder{color:var(--dim)}
.list{flex:1;overflow-y:auto;padding:6px 10px 10px}
.lab{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--dim);padding:12px 10px 6px;text-transform:uppercase}
.row{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:18px;cursor:pointer;transition:.2s}
.row:hover,.row.on{background:var(--glass2)}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.rt{flex:1;min-width:0}
.rt b{font-size:14.5px;font-weight:600;display:flex;justify-content:space-between}
.rt b i{font-style:normal;font-size:11px;color:var(--dim);font-weight:500}
.rt span{font-size:12.5px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;border-radius:10px;padding:2px 7px;margin-left:6px}
.me{margin:6px 10px 12px;padding:12px;border-radius:20px;display:flex;align-items:center;gap:10px;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--navy);flex:none}
.me small{color:var(--dim);font-size:11px;display:block}
.ch{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.back{background:var(--glass2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.ch h2{font-size:16px;font-weight:700}
.ch p{font-size:11.5px;color:var(--dim)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4cd964;margin-right:5px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.m{max-width:80%;display:flex;flex-direction:column;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.m.me2{align-self:flex-end;align-items:flex-end}
.who{font-size:11px;font-weight:600;margin:6px 8px 3px;color:var(--dim)}
.bub{padding:10px 15px;border-radius:20px;font-size:14.5px;line-height:1.4;background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(0,25,141,.08);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-left-radius:6px;overflow-wrap:anywhere}
.me2 .bub{background:var(--mine);color:#fff;border-color:rgba(255,255,255,.3);border-bottom-left-radius:20px;border-bottom-right-radius:6px}
.tm{font-size:10px;color:var(--dim);margin:3px 8px}
.day{align-self:center;font-size:11px;color:var(--dim);background:var(--glass);padding:4px 12px;border-radius:12px;margin:8px 0}
.typing{align-self:flex-start;padding:13px 16px;border-radius:20px;border-bottom-left-radius:6px;display:none;gap:5px;align-items:center}
.typing.on{display:flex;animation:tyIn .3s cubic-bezier(.16,1,.3,1) both;transform-origin:left bottom}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.35;animation:bl 1.2s cubic-bezier(.4,0,.2,1) infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes bl{0%,60%,100%{opacity:.35;transform:translateY(0) scale(1)}30%{opacity:1;transform:translateY(-5px) scale(1.15)}}
@keyframes tyIn{from{opacity:0;transform:translateY(8px) scale(.85)}to{opacity:1;transform:none}}
.comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.comp textarea{flex:1;resize:none;max-height:110px;padding:12px 16px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);font:500 14.5px var(--f);outline:none}
.comp textarea::placeholder{color:var(--dim)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold),#ff9a3d);color:var(--navy);font-size:19px;font-weight:800;cursor:pointer;flex:none;transition:transform .15s}
.send:active{transform:scale(.9)}
.empty{margin:auto;text-align:center;color:var(--dim);font-size:14px;padding:30px}
.sheet{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(235,240,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
.sheet.off{display:none}
.card{width:min(380px,100%);border-radius:32px;padding:28px;text-align:center}
.card h3{font-size:22px;font-weight:800;margin:14px 0 6px}
.card p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:18px}
.card input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);font:600 15px var(--f);outline:none;text-align:center;margin-bottom:14px}
.card button{width:100%;padding:14px;border-radius:16px;border:0;background:linear-gradient(135deg,var(--gold),#ff9a3d);color:var(--navy);font:800 15px var(--f);cursor:pointer}
.card .logo{margin:0 auto;width:60px;height:60px;border-radius:19px;font-size:24px}
.upd{align-self:stretch;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-left:5px solid #ff3b30;box-shadow:0 4px 16px rgba(0,25,141,.08);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.tag{background:#ff3b30;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:8px;margin-right:8px}
.ut{display:flex;align-items:center;font-size:11px;color:var(--dim);margin-bottom:8px}
.upd p{font-size:15.5px;font-weight:600;line-height:1.45}
.ub{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:var(--dim)}
.sh2{border:0;background:var(--blue);color:#fff;padding:8px 16px;border-radius:14px;font:700 12px var(--f);cursor:pointer}
.card .g,.alt .g{background:rgba(0,25,141,.08);color:var(--text)}
.alt{display:flex;gap:8px;margin-top:10px}
.alt .g{flex:1;padding:12px;border-radius:14px;font:700 13px var(--f);text-decoration:none;text-align:center;border:0;cursor:pointer}
.shield{vertical-align:-3px;margin-left:4px;flex:none}
.org{font-weight:600;color:var(--dim)}
.uimg{width:100%;border-radius:14px;margin-top:10px;display:block}
.pv{display:none;padding:8px 14px 0;align-items:center;gap:10px}
.pv.on{display:flex}
.pv img{height:56px;border-radius:12px}
.pv button{border:0;background:var(--glass2);border-radius:50%;width:26px;height:26px;cursor:pointer;color:var(--text);font-size:15px}
.att{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);font-size:19px;cursor:pointer;flex:none}
.comp button:disabled,.comp textarea:disabled{opacity:.45;cursor:not-allowed}
.qt{background:rgba(255,255,255,.95);color:var(--text);border-radius:14px;padding:10px 12px;border-left:4px solid #ff3b30;min-width:200px;text-align:left}
.qb{font-weight:600;margin:8px 0}
.qs{font-size:11px}
.sheet{overflow-y:auto}.card{max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain}html,body{height:100dvh}.app{height:100dvh}.inv{margin-top:10px;width:100%;padding:10px;border-radius:14px;border:0;background:var(--blue);color:#fff;font:700 13px var(--f);cursor:pointer}
.ar{display:flex;flex-wrap:wrap;gap:5px;margin:3px 6px 0;align-items:center}
.m.me2 .ar{justify-content:flex-end}
.rc,.ab,.rp{border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--text);font:600 11.5px var(--f);border-radius:12px;padding:4px 10px;min-height:28px;cursor:pointer;line-height:1.3}
.rc b{font-weight:800;margin-left:2px}
.rc.on{background:rgba(0,25,141,.14);border-color:var(--blue)}
.rc.vf{background:rgba(245,200,75,.3);border-color:#d9a416}
.ab{background:transparent;border-color:transparent;color:var(--dim)}
.ab:hover,.rc:hover{background:var(--glass2)}
.rp{background:var(--blue);color:#fff;border-color:var(--blue)}
.upd .ar{margin:10px 0 0}
.sysm{align-self:center;font-size:11.5px;font-weight:600;color:var(--dim);background:var(--glass);padding:5px 12px;border-radius:12px;margin:6px 0;text-align:center;border:1px solid var(--line)}
.tool-v{display:none;flex:1;min-height:0;flex-direction:column}
.chat.tool .tool-v{display:flex}
.chat.tool .msgs,.chat.tool .comp,.chat.tool .typing,.chat.tool .pv{display:none!important}
.tbar{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tt{font-weight:700;font-size:14px;flex:1}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--text);font:700 12.5px var(--f);padding:8px 14px;border-radius:14px;cursor:pointer}
.pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pill.pr{background:linear-gradient(135deg,var(--gold),#ff9a3d);border:0;color:var(--navy)}
.bsel{flex:1;min-width:130px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.9);font:600 13px var(--f);color:var(--text)}
.kan{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x proximity}
.col{flex:0 0 272px;display:flex;flex-direction:column;min-height:0;background:rgba(0,25,141,.05);border:1px solid var(--line);border-radius:20px;scroll-snap-align:start}
.col.dz{background:rgba(245,200,75,.24);border-color:var(--gold)}
.chd{padding:12px 14px 6px;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.chd em{font-style:normal;background:var(--glass2);border-radius:10px;padding:1px 8px;font-size:11.5px}
.cbd{flex:1;overflow-y:auto;padding:6px 10px 12px;display:flex;flex-direction:column;gap:8px}
.ce{font-size:12px;color:var(--dim);text-align:center;padding:18px 8px;border:1.5px dashed var(--line);border-radius:14px}
.sc{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:16px;padding:11px;box-shadow:0 2px 10px rgba(0,25,141,.07)}
.sct{display:flex;justify-content:space-between;gap:6px;font-size:11px;align-items:center}
.dk{padding:2px 8px;border-radius:9px;font-weight:700}
.own{color:var(--dim);font-weight:600}
.scn{font-weight:700;font-size:14px;line-height:1.35;margin:8px 0}
.bar{height:5px;border-radius:5px;background:var(--glass2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9a3d);transition:width .3s}
.ck{display:grid;gap:5px;margin:10px 0}
.cl{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:500;cursor:pointer}
.cl input{accent-color:var(--blue);width:16px;height:16px}
.sca{display:flex;gap:6px}
.sca button{border:1px solid var(--line);background:var(--glass2);color:var(--text);border-radius:11px;padding:8px 12px;min-height:34px;font:700 12px var(--f);cursor:pointer}
.sca .ev2{flex:1}
.sca button:disabled{opacity:.35;cursor:not-allowed}
.hint{padding:8px 14px;font-size:12.5px;font-weight:600;background:rgba(245,200,75,.3)}
.bw{flex:1;min-height:0;overflow:auto;background:radial-gradient(rgba(0,25,141,.2) 1.3px,transparent 1.4px) 0 0/22px 22px,#f6f8ff;border-radius:0 0 28px 28px}
.bd{position:relative;width:1400px;height:1000px}
.bd svg{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.ev{position:absolute;width:190px;z-index:2;transform:rotate(var(--r,0deg));background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 16px rgba(0,25,141,.18);-webkit-user-select:none;user-select:none}
.ev.t-note{background:#fff3a8}
.ev.t-msg,.ev.t-photo{touch-action:none}
.ev .evb[contenteditable]{-webkit-user-select:text;user-select:text}
.ev.sel{outline:3px solid var(--blue)}
.ev.drag{box-shadow:0 14px 30px rgba(0,25,141,.3);z-index:4}
.eh{height:22px;display:flex;justify-content:center;align-items:center;position:relative;cursor:grab;touch-action:none}
.pin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a80,#d32f2f);box-shadow:0 2px 3px rgba(0,0,0,.35)}
.ev .x{position:absolute;right:2px;top:0;border:0;background:transparent;color:var(--dim);font-size:17px;cursor:pointer;width:28px;height:22px}
.evb{padding:2px 12px 8px;font-size:13px;line-height:1.4;overflow-wrap:anywhere;outline:none;min-height:36px}
.evb:empty:before{content:'Write a note…';color:var(--dim)}
.eq{font-weight:600}
.ea{font-size:11px;color:var(--dim);margin-top:6px;font-weight:600}
.evf{padding:0 10px 10px}
.vb{width:100%;border:1px dashed var(--line);background:transparent;border-radius:9px;padding:5px;font:700 11px var(--f);color:var(--dim);cursor:pointer}
.vb.v{background:rgba(31,157,98,.15);border:1px solid #1f9d62;color:#17784a}
.bd.lk .evb{pointer-events:none}
.bd.lk .ev{cursor:pointer}
.bemp{position:absolute;left:30px;top:30px;max-width:330px;font-size:13.5px;color:var(--dim);line-height:1.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:16px;font:600 13px var(--f);opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.card select{width:100%;padding:13px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.9);font:600 14px var(--f);color:var(--text);margin-bottom:14px}
.logo{background:none!important}.logo img{height:42px;width:auto;display:block}.card .logo img{height:66px}

/* full-bleed layout + white thin-grid background */
html,body{background:#fff}
.bg{background-color:#fff;background-image:linear-gradient(rgba(0,25,141,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,25,141,.055) 1px,transparent 1px);background-size:28px 28px}
.orb{display:none}
.app{max-width:none;margin:0;padding:0;gap:0}
.side,.chat{border-radius:0}
.side.glass,.chat.glass{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border:0}
@media(min-width:800px){.app{grid-template-columns:360px 1fr;padding:0;gap:0}.side.glass{border-right:1px solid var(--line)}}
.ch,.comp,.tbar{background:rgba(255,255,255,.92)}
.ch{padding:14px clamp(16px,3vw,32px)}
.comp{padding:12px clamp(12px,3vw,32px)}
.tbar{padding:12px clamp(14px,3vw,32px)}
.msgs{padding:18px clamp(16px,4vw,56px)}
.m{max-width:min(80%,680px)}
.kan{padding:16px clamp(12px,3vw,32px)}
.sh{padding:22px 22px 10px}
.list{padding:6px 14px 10px}
.me{margin:6px 14px 16px}
.bw{background-color:#fff;background-image:linear-gradient(rgba(0,25,141,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,25,141,.07) 1px,transparent 1px);background-size:24px 24px;border-radius:0}
.inv.bell{background:rgba(0,25,141,.08);color:var(--text)}
.mn{background:rgba(245,200,75,.5);color:var(--navy);font-weight:800;border-radius:6px;padding:0 4px}
.me2 .mn{background:#F5C84B}
.nb{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translate(-50%,-160%);width:min(520px,calc(100vw - 24px));background:var(--navy);color:#fff;border-radius:18px;padding:12px 16px;z-index:30;box-shadow:0 12px 32px rgba(0,14,75,.35);cursor:pointer;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .2s;border-left:5px solid var(--gold);opacity:0;pointer-events:none}
.nb.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.nb b{color:var(--gold);font-size:13px}
.nb small{display:block;opacity:.8;font-size:12px;margin-top:2px}
.nb span{display:block;font-weight:600;font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug{display:none;padding:8px 14px 0;background:rgba(255,255,255,.92)}
.sug.on{display:block}
.sug button{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:9px 14px;font:700 13px var(--f);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.sug button span{font-weight:500;color:var(--dim)}
.chat.tool .sug{display:none!important}

/* iOS 16 style: 16pt layout margins, inset grouped lists, safe-area padding */
:root{--sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px));--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);padding:0!important}
.sh{padding:calc(16px + var(--st)) var(--sr) 8px var(--sl)}
.list{padding:0 var(--sr) 8px var(--sl)}
.me{margin:8px var(--sr) calc(12px + var(--sb)) var(--sl)}
.lab{padding:18px 16px 7px}
.grp{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{border-radius:0;padding:0 14px;gap:12px}
.row .ic{margin:9px 0}
.rt{padding:11px 0}
.row+.row .rt{border-top:1px solid var(--line)}
.search{background:rgba(120,120,128,.12);border:0;border-radius:12px}
.ch{padding:calc(12px + var(--st)) max(var(--sr),clamp(16px,3vw,32px)) 12px max(var(--sl),clamp(16px,3vw,32px))}
.comp{padding:10px max(var(--sr),clamp(16px,3vw,32px)) calc(10px + var(--sb)) max(var(--sl),clamp(16px,3vw,32px))}
.msgs{padding:16px max(var(--sr),clamp(16px,4vw,56px)) 16px max(var(--sl),clamp(16px,4vw,56px))}
.tbar{padding:12px max(var(--sr),clamp(16px,3vw,32px)) 12px max(var(--sl),clamp(16px,3vw,32px))}
.kan{padding:16px max(var(--sr),clamp(16px,3vw,32px)) 16px max(var(--sl),clamp(16px,3vw,32px))}
.sug{padding:8px max(var(--sr),16px) 0 max(var(--sl),16px)}
.sheet{padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.toast{bottom:calc(90px + var(--sb))}

/* ---- site <-> chat transition ---- */
html.jk-enter{background:#000E4B}
.jkc{position:fixed;inset:0;z-index:2147483000;display:none;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#0a1f8a 0%,#000E4B 70%);--jk-back:rgba(255,255,255,.5);pointer-events:none}
html.jk-enter .jkc,.jkc.on{display:grid;pointer-events:auto}
.jkc-in{width:76px;height:76px}.jkc-in svg{width:100%;height:100%;display:block}
.jk-dot{transform-box:fill-box;transform-origin:center;animation:jkDotFast 1.1s cubic-bezier(.4,0,.2,1) infinite backwards}
.jk-d2{animation-delay:.15s}.jk-d3{animation-delay:.3s}
@keyframes jkDotFast{0%,60%,100%{transform:translateY(0) scale(1);opacity:.45}30%{transform:translateY(-5px) scale(1.2);opacity:1}}
@keyframes jkIcPop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.jkc.pop .jkc-in{animation:jkIcPop .5s cubic-bezier(.34,1.56,.64,1) .1s both}
.app.jk-in .side,.app.jk-in .chat{animation:jkRise .6s cubic-bezier(.16,1,.3,1) both}
.app.jk-in .chat{animation-delay:.06s}
@keyframes jkRise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}
.app.jk-out{animation:jkSink .4s cubic-bezier(.5,0,.75,0) forwards}
@keyframes jkSink{to{opacity:0;transform:scale(.96) translateY(10px)}}
.home{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--navy);display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s}
.home:hover{background:#fff}.home:active{transform:scale(.92)}
.home svg{width:20px;height:20px}
.brand>div:nth-child(2){min-width:0}
/* ---- delete message ---- */
.ab.dl{color:#c62828;font-weight:700}
.ab.dl:hover,.ab.dl:active{background:rgba(198,40,40,.1)}
.m.gone,.upd.gone{opacity:0;transform:translateX(28px) scale(.95);height:0!important;margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden;pointer-events:none;transition:opacity .2s ease,transform .26s ease,height .26s ease .05s,margin .26s ease .05s,padding .26s ease .05s}
.dcard{padding:24px 22px 18px}
.dico{width:54px;height:54px;margin:0 auto;border-radius:18px;background:rgba(198,40,40,.1);display:grid;place-items:center;font-size:26px}
.card .dbtn{background:#d93025;color:#fff;margin-bottom:10px}
.card .dbtn:active{background:#b3241b}
#dshp{overflow-wrap:anywhere}
@media(max-width:799px){.dsheet{place-items:end center}.dcard{border-radius:28px 28px 22px 22px;animation:jkSheetUp .3s cubic-bezier(.16,1,.3,1)}}
@keyframes jkSheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.app.jk-in .side,.app.jk-in .chat,.app.jk-out,.dcard,.jk-dot,.jkc.pop .jkc-in,.typing,.typing i{animation:none!important}.typing i{opacity:.7}.m.gone,.upd.gone{transition:none}}
</style>

var p=patch?F.updateDoc(ref,patch):F.setDoc(ref,strip({board:S.board,k:it.k,u:it.u||'',t:String(it.t||'').slice(0,2000),ed:!!it.ed,v:it.v||'',x:it.x,y:it.y,r:it.r,uid:FB.uid,createdAt:F.serverTimestamp(),img:safeImg(it.img)||undefined,src:it.src}));
p.catch(function(e){fbErr(e,'Could not save')})}

function fbLink(a,c,add){if(!FBON)return;var F=FB.F,id=[a,c].sort().join('~'),ref=F.doc(FB.db,'boardLinks',id);
(add?F.setDoc(ref,{board:S.board,a:a,b:c}):F.deleteDoc(ref)).catch(function(e){fbErr(e,'Could not save')})}

RAWL.forEach(function(l){if(l.a===id||l.c===id)F.deleteDoc(F.doc(FB.db,'boardLinks',l.id)).catch(function(){})})}
function canDel(m){return !!S.ed||(FBON?(FB&&m.uid===FB.uid):m.u===S.me)}
var DEL=null,REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
function snip(m){var t=((m.ref?m.ref.t:m.t)||'').replace(/\s+/g,' ').trim();if(!t)return m.img?'This photo':'This message';return '“'+(t.length>90?t.slice(0,89)+'…':t)+'”'}
function delMsg(f){DEL=f;var own=FBON?(FB&&f.m.uid===FB.uid):f.m.u===S.me;$('dshp').textContent=snip(f.m)+(own?' will be removed for everyone in this room.':' was written by another member. Deleting it removes it for everyone in this room.');$('dsh').classList.remove('off');$('dno').focus()}

var finish=function(){if(FBON){FB.F.deleteDoc(FB.F.doc(FB.db,'rooms',f.room,'messages',id)).then(function(){toast('Message deleted')}).catch(function(e){var x=document.querySelector('[data-mid="'+id+'"]');if(x){x.classList.remove('gone');x.style.height=''}fbErr(e,'Could not delete')});return}
var a=S.msgs[f.room],i=a.indexOf(f.m);if(i>=0)a.splice(i,1);save();if(S.cur===f.room)renderMsgs(true);renderList();toast('Message deleted')};
if(el&&!REDUCE){el.style.height=el.offsetHeight+'px';void el.offsetHeight;el.classList.add('gone');setTimeout(finish,300)}else finish()}
$('dok').onclick=doDel;$('dno').onclick=closeDel;

/* ---- site <-> chat transition ---- */
function goSite(){var b=$('home'),r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,dest='/';
try{var rt=sessionStorage.getItem('jk-return');if(rt&&rt.charAt(0)==='/'&&rt.indexOf('//')!==0&&rt.indexOf('/community')!==0)dest=rt;sessionStorage.setItem('jk-tr',JSON.stringify({d:'out',t:Date.now()}))}catch(e){}
var c=$('jkc'),R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+4,done=false,go=function(){if(done)return;done=true;location.href=dest};
if(REDUCE||!c.animate){go();return}
c.classList.add('on','pop');$('app').classList.add('jk-out');
var a=c.animate([{clipPath:'circle(0px at '+x+'px '+y+'px)'},{clipPath:'circle('+R+'px at '+x+'px '+y+'px)'}],{duration:480,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});a.onfinish=go;setTimeout(go,900)}

if(REDUCE||!c.animate){h.classList.remove('jk-enter');return}

var ready=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,400)})]):Promise.resolve();
ready.then(function(){$('app').classList.add('jk-in');requestAnimationFrame(function(){requestAnimationFrame(function(){var a=c.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.08)'}],{duration:480,easing:'cubic-bezier(.4,0,.2,1)',delay:140,fill:'forwards'});a.onfinish=fin;setTimeout(fin,1400)})})})}

window.addEventListener('pageshow',function(e){if(e.persisted){var c=$('jkc');c.classList.remove('on');c.getAnimations&&c.getAnimations().forEach(function(a){a.cancel()});$('app').classList.remove('jk-out','jk-in');document.documentElement.classList.remove('jk-enter')}});

FB.F.setDoc(FB.F.doc(FB.db,'users',FB.uid),{name:n},{merge:true}).then(function(){S.me=n;renderMe();$('sheet').classList.add('off')}).catch(function(e){fbErr(e,'Could not save name')})}
$('gsign').onclick=function(){if(!FB)return;var er=$('gerr');er.style.display='none';var p=new FB.A.GoogleAuthProvider();
FB.A.signInWithPopup(FB.auth,p).catch(function(e){var c=e&&e.code;
if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment')return FB.A.signInWithRedirect(FB.auth,p);
if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){er.textContent='Sign-in failed. Please try again.';er.style.display='block'}})};
$('sout').onclick=function(){if(FB)FB.A.signOut(FB.auth)};

function pushCall(path,body){if(!JK.pushUrl||!FB||!FB.auth.currentUser)return Promise.resolve();return FB.auth.currentUser.getIdToken().then(function(tok){return fetch(JK.pushUrl+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(body)})}).then(function(r){if(!r.ok)throw new Error('push '+path+' '+r.status);return r})}
/* ---- push notifications (works with push-worker/src/index.js) ---- */
function registerPushIfGranted(){if(!FBON||!FB||!FB.uid||PUSHREG||perm()!=='granted'||!JK.vapidKey||!('serviceWorker' in navigator))return;PUSHREG=true;
Promise.all([navigator.serviceWorker.register('firebase-messaging-sw.js',{scope:'./'}),import(FBU+'firebase-messaging.js')]).then(function(r){var M=r[1];
return M.isSupported().then(function(ok){if(!ok)return;return M.getToken(M.getMessaging(FB.app),{vapidKey:JK.vapidKey,serviceWorkerRegistration:r[0]}).then(function(tok){
if(!tok)return;return pushCall('/register',{token:tok})})})}).catch(function(e){PUSHREG=false;console.warn('Push registration failed',e)})}
if(FBON&&'serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){var d=e.data||{};if(d.type==='open-room'&&CH.some(function(c){return c.id===d.room&&!c.sp}))open(d.room)});

load();renderMe();renderList();
if(FBON)fbBoot();else if(S.me){$('sheet').classList.add('off')}
